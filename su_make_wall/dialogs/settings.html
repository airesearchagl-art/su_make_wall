<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MakeWall</title>
<style>
/* ── リセット & ベース ────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
  font-size: 12px;
  line-height: 1.4;
  background: #ececec;
  color: #1e1e1e;
  padding: 10px 12px 12px;
  /* SketchUp HtmlDialog でスクロールバーが出ないよう overflow を抑制 */
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

/* ── パネルタイトル ─────────────────────────────────────────── */
.panel-title {
  font-size: 11px;
  font-weight: 700;
  color: #555;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding-bottom: 7px;
  margin-bottom: 10px;
  border-bottom: 1px solid #c8c8c8;
}

/* ── 各パラメータ行 ──────────────────────────────────────────── */
.row {
  display: flex;
  align-items: center;
  margin-bottom: 8px;
}
.row:last-child { margin-bottom: 0; }

label {
  width: 52px;
  flex-shrink: 0;
  color: #444;
  font-size: 12px;
  cursor: default;
}

/* ── テキスト/数値入力 ────────────────────────────────────────── */
input[type="number"] {
  flex: 1;
  min-width: 0;
  height: 22px;
  padding: 0 5px;
  border: 1px solid #b0b0b0;
  border-radius: 2px;
  background: #fff;
  font-family: inherit;
  font-size: 12px;
  color: #1e1e1e;
  outline: none;
  /* Chrome の spinner を非表示にしない（mm 入力に便利） */
}
input[type="number"]:focus {
  border-color: #0078d4;
  box-shadow: 0 0 0 2px rgba(0, 120, 212, 0.20);
}
/* 無効な値（マイナスなど）の視覚フィードバック */
input[type="number"]:invalid {
  border-color: #c0392b;
}

/* ── セレクトボックス ──────────────────────────────────────────── */
select {
  flex: 1;
  min-width: 0;
  height: 22px;
  padding: 0 4px;
  border: 1px solid #b0b0b0;
  border-radius: 2px;
  background: #fff;
  font-family: inherit;
  font-size: 12px;
  color: #1e1e1e;
  outline: none;
  appearance: auto;
  cursor: pointer;
}
select:focus {
  border-color: #0078d4;
  box-shadow: 0 0 0 2px rgba(0, 120, 212, 0.20);
}

/* ── 単位ラベル ──────────────────────────────────────────────── */
.unit {
  width: 22px;
  flex-shrink: 0;
  padding-left: 4px;
  color: #888;
  font-size: 11px;
}
</style>
</head>
<body>

<div class="panel-title">MakeWall パラメータ</div>

<!-- 高さ -->
<div class="row">
  <label for="inp-height">高さ</label>
  <input type="number" id="inp-height" min="1" max="99999" step="50" value="2400">
  <span class="unit">mm</span>
</div>

<!-- 厚み -->
<div class="row">
  <label for="inp-thickness">厚み</label>
  <input type="number" id="inp-thickness" min="1" max="9999" step="10" value="150">
  <span class="unit">mm</span>
</div>

<!-- 基準線 -->
<div class="row">
  <label for="inp-justification">基準線</label>
  <select id="inp-justification">
    <option value="center">中心 (center)</option>
    <option value="left">左端 (left)</option>
    <option value="right">右端 (right)</option>
  </select>
  <span class="unit"></span>
</div>

<script>
'use strict';

/* ── Ruby ← JS: パラメータ変更を通知 ────────────────────────── */
function sendParam(key, value) {
  if (typeof sketchup !== 'undefined') {
    sketchup.update_param(key, String(value));
  }
}

/* ── 数値入力カスタムステップロジック ───────────────────────────
 *
 * 問題の背景:
 *   min="1" step="50" のとき、ブラウザの有効値シーケンスは
 *   1, 51, 101, ..., 2351, 2401, 2451, ... となる。
 *   2400 はシーケンス外のため、スピンボタン最初のクリックが
 *   最寄り有効値（2401）に補正され、見かけ上 1 刻みになってしまう。
 *
 * 解決策:
 *   ① keydown ArrowUp/Down → preventDefault() + step 刻みで手動増減
 *   ② input イベント（スピンボタン）→ delta ≤ step ならスピン操作と
 *      みなして prev ± step に補正（prev は確定値のキャッシュ）
 *   ③ change（Enter/blur）→ 手動入力を確定してそのまま送信
 *   ④ setupStepInput が返す setter で updateFromRuby から prev を同期
 *
 * @param {string} id        入力要素の id
 * @param {string} paramKey  Ruby に送るキー名
 * @param {number} fallback  不正値リセット時のデフォルト値
 * @returns {Function}  val を受け取り el.value と prev を同期する setter
 */
function setupStepInput(id, paramKey, fallback) {
  var el   = document.getElementById(id);
  var step = parseFloat(el.getAttribute('step')) || 1;
  var min  = parseFloat(el.getAttribute('min'))  || 1;
  var prev = parseFloat(el.value) || fallback;   /* 最後に確定した値 */

  /* ① キーボード ArrowUp/Down ─────────────────────────────────── */
  el.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
    e.preventDefault();                          /* ブラウザ既定動作をキャンセル */
    var next = prev + (e.key === 'ArrowUp' ? step : -step);
    next = Math.max(min, next);
    this.value = next;                           /* 値のセット（input は発火しない）*/
    prev = next;
    sendParam(paramKey, next);
  });

  /* ② スピンボタンクリック ────────────────────────────────────── */
  el.addEventListener('input', function () {
    var cur = parseFloat(this.value);
    if (isNaN(cur)) return;
    var delta = Math.abs(cur - prev);
    /*
     * delta <= step : スピンボタン操作（ブラウザが 1 刻みで動いた）→ 補正
     * delta >  step : 手動入力中（大きな変化）→ change イベントに委ねる
     */
    if (delta > 0 && delta <= step) {
      var dir  = cur >= prev ? 1 : -1;
      var next = prev + dir * step;
      next = Math.max(min, next);
      this.value = next;
      prev = next;
      sendParam(paramKey, next);
    }
  });

  /* ③ Enter / フォーカスアウト（手動入力を確定） ─────────────── */
  el.addEventListener('change', function () {
    var v = parseFloat(this.value);
    if (!isNaN(v) && v >= min) {
      prev = v;
      sendParam(paramKey, v);
    } else {
      this.value = prev;                         /* 不正値はリセット */
    }
  });

  /* ④ updateFromRuby から prev を同期するための setter ────────── */
  return function (val) {
    el.value = val;
    prev = parseFloat(val) || fallback;
  };
}

/* 数値入力フィールドの初期化 */
var setHeight    = setupStepInput('inp-height',    'height',    2400);
var setThickness = setupStepInput('inp-thickness', 'thickness', 150);

/* セレクト: 選択直後（change）で即送信 */
document.getElementById('inp-justification').addEventListener('change', function () {
  sendParam('justification', this.value);
});

/* ── JS ← Ruby: 初期値 / 外部更新を受け取る ─────────────────── */
/**
 * Ruby 側から呼び出す。
 * @param {Object} params  { height: number, thickness: number, justification: string }
 */
function updateFromRuby(params) {
  if (params.height        != null) setHeight(params.height);
  if (params.thickness     != null) setThickness(params.thickness);
  if (params.justification != null) {
    document.getElementById('inp-justification').value = params.justification;
  }
}

/* ── 準備完了を Ruby へ通知（全要素が確定してから） ─────────── */
if (typeof sketchup !== 'undefined') {
  sketchup.ready();
}
</script>
</body>
</html>
